[build]
  command = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish = "group-no1/app/static"

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
  included_files = ["group-no1/**"]

# Static assets are published from the app/static directory
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

# Everything else routes to the Flask function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
  force = true
